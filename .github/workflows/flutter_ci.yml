name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/driver-app-ui-api-integration

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Existing non-fatal lint debt is reported but must not block tests.
        # Analyzer errors still fail this step.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test
